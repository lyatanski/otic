name: build
on: push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: gcc -Wall -Wextra -Os -o tic main.c
      - if: runner.os == 'Linux'
        run: gcc -Wall -Wextra -o spec test/main.c && ./spec
