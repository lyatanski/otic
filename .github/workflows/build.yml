name: build
on: push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    cc: gcc,   cflags: -Wall -Wextra, out: "-o " }
          - { os: ubuntu-24.04-arm, cc: gcc,   cflags: -Wall -Wextra, out: "-o " }
          - { os: macos-latest,     cc: clang, cflags: -Wall -Wextra, out: "-o " }
          - { os: windows-latest,   cc: cl,    cflags: -nologo -std:clatest -W4 -D_CRT_SECURE_NO_WARNINGS -D_CRT_NONSTDC_NO_WARNINGS, out: -Fe }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: ${{ matrix.cflags }}
      OUT: ${{ matrix.out }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" >> $env:GITHUB_ENV
      - name: Build
        run:  $CC $CFLAGS -Os ${OUT}tic main.c
      - name: Module specs
        run:  for m in core ia64 arm8 elfs mach pe32; do $CC $CFLAGS ${OUT}spec-$m test/$m.c && ./spec-$m || exit 1; done
      - name: Test
        run:  $CC $CFLAGS ${OUT}spec test/main.c && TIC=./tic ./spec
