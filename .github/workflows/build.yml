name: build
on: push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Build
        run:  gcc -Wall -Wextra -Os -o tic main.c
      - name: Test
        run:  gcc -Wall -Wextra -o spec test/main.c && TIC=./tic ./spec
