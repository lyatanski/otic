name: build
on: push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Build
        run:  gcc -std=gnu2x -Wall -Wextra -Os -o tic main.c
      - name: Module specs
        run:  for m in core ia64 arm8 elfs mach pe32; do gcc -std=gnu2x -Wall -Wextra -o spec-$m test/$m.c && ./spec-$m || exit 1; done
      - name: Test
        run:  gcc -std=gnu2x -Wall -Wextra -o spec test/main.c && TIC=./tic ./spec
